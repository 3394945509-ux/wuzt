<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>页面走丢了 · 伍忠天</title>
<style>
  :root {
    --ink: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.5);
    --blue: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
      "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    background: #000;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .glow {
    position: fixed;
    width: 70vmax;
    height: 70vmax;
    left: 50%;
    top: -35vmax;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(10, 132, 255, 0.22), transparent 65%);
    filter: blur(70px);
    pointer-events: none;
  }
  main { position: relative; text-align: center; max-width: 520px; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  h1 {
    margin: 22px 0 0;
    font-size: clamp(72px, 22vw, 132px);
    line-height: 0.9;
    font-weight: 700;
    letter-spacing: -0.05em;
    background: linear-gradient(175deg, #fff 15%, #7c7c85 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    margin: 22px 0 0;
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--muted);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 34px;
  }
  a.btn {
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    text-decoration: none;
    transition: transform 0.35s cubic-bezier(0.2, 1.08, 0.32, 1),
      background-color 0.35s ease, border-color 0.35s ease;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #0077ed; transform: translateY(-2px); }
  .btn-ghost {
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(245, 245, 247, 0.8);
  }
  .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.36); transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) {
    a.btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <a class="brand" href="/"><span class="dot"></span>伍忠天</a>
    <h1>404</h1>
    <p>这个地址没有内容。<br />可能是链接打错了，或者简历更新后旧页面已经下线。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">回到简历首页</a>
      <a class="btn btn-ghost" href="mailto:3394945509@qq.com">发邮件给我</a>
    </div>
  </main>
</body>
</html>
